name: CI

on:
  push:
    branches: [main, feature/mvp-v0.1]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate and build
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download Go modules
        run: go mod download

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0

      - name: Generate bindings and build Windows from clean checkout
        run: wails build -clean

      - name: Type-check frontend
        working-directory: frontend
        run: npm run type-check

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Verify Go formatting
        shell: pwsh
        run: |
          $unformatted = gofmt -l .
          if ($unformatted) {
            Write-Host "The following Go files need gofmt:"
            $unformatted | ForEach-Object { Write-Host $_ }
            exit 1
          }

      - name: Vet Go code
        run: go vet ./...

      - name: Run Go tests
        run: go test ./...

      - name: Package local distribution
        shell: pwsh
        run: ./scripts/package.ps1

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: CISSPQuizTrainer-win-x64
          path: |
            build/bin/CISSPQuizTrainer.exe
            build/bin/CISSPQuizTrainer-win-x64.zip
            build/bin/checksums.txt
          if-no-files-found: error
          retention-days: 7
